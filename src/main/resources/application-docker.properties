# Configuración para el perfil Docker en auth-service

# Nombre de la aplicación
spring.application.name=auth-service

# Configuración de MongoDB
spring.data.mongodb.host=${MONGO_HOST:mongo}
spring.data.mongodb.port=${MONGO_PORT:27017}
spring.data.mongodb.database=${MONGO_DATABASE:hotel_auth_db}

# Configuración JWT
app.jwtSecret=${JWT_SECRET:H8DSF7sdf87DSF87ds87f6SD87f6ds78F6SD7f6d7F6D87f6d78F6ds78F6DS78f6d78F6d78FS6d87f6D78S}
app.jwtExpirationMs=${JWT_EXPIRATION:86400000}
app.refreshTokenExpirationMs=${REFRESH_TOKEN_EXPIRATION:604800000}

# Configuración del servidor
server.port=${SERVER_PORT:8080}

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.hotel.authservice=INFO

# Permitir acceso a endpoints de actuator sin autenticación
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
spring.security.management.endpoints.web.exposure.include=*
# La siguiente línea es crítica para permitir el acceso sin autenticación
management.endpoints.web.cors.allowed-origins=*
management.endpoints.web.cors.allowed-methods=*